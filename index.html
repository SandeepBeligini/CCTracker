<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Limit & Utilization Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header-flex">
            <div>
                <h1>Credit Card Portfolio</h1>
                <p>Unified view of limits, usage, and available credit</p>
            </div>
            <button id="update-expense-btn" class="action-btn">+ Update Expense</button>
        </header>

        <!-- Summary Cards -->
        <div class="summary-grid">
            <div class="summary-card">
                <h3>Total Credit Limit</h3>
                <p id="total-limit">₹0</p>
            </div>
            <div class="summary-card">
                <h3>Total Used Limit</h3>
                <p id="total-used">₹0</p>
            </div>
            <div class="summary-card">
                <h3>Total Available Limit</h3>
                <p id="total-available">₹0</p>
            </div>
            <div class="summary-card">
                <h3>Overall Utilization</h3>
                <p id="overall-utilization">0%</p>
            </div>
        </div>

        <!-- Detailed Cards List -->
        <section class="card-list-section">
            <h2>Card Breakdown</h2>
            <div id="card-container" class="card-grid">
                <!-- Dynamically populated by script.js -->
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
